<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Prep365 AI Calling</title>
<link rel="icon" type="image/png" href="/favicon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="/assets/libs/supabase.min.js"></script>
<script src="/assets/branding.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #F8FAFC;
  --panel: #FFFFFF;
  --border: #E5E7EB;
  --text-heading: #0F172A;
  --text-body: #4B5563;
  --text-muted: #64748B;
  --brand: #2563EB;
  --brand-hover: #1D4ED8;
  --success: #10B981;
  --danger: #EF4444;
}
body {
  font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text-body);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.login-card {
  position: relative;
  z-index: 1;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 36px 32px;
  width: 100%;
  max-width: 420px;
  box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.06), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
}

.brand {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  margin-bottom: 24px;
}
.brand-logo-wrap {
  width: 52px;
  height: 52px;
  border-radius: 12px;
  background: linear-gradient(135deg, #2563EB 0%, #4338CA 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
  overflow: hidden;
}
.brand img.app-logo-img {
  max-width: 34px;
  max-height: 34px;
  object-fit: contain;
}
.brand .app-brand-title {
  font-size: 18px;
  font-weight: 800;
  color: var(--text-heading);
  letter-spacing: -0.01em;
}

h2 {
  font-size: 20px;
  font-weight: 700;
  color: var(--text-heading);
  margin-bottom: 6px;
  text-align: center;
}
.subtitle {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 24px;
  text-align: center;
}

.form-group {
  margin-bottom: 18px;
}
.form-group label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: #374151;
  margin-bottom: 6px;
}
.form-group input {
  width: 100%;
  background: #FFFFFF;
  border: 1px solid #D1D5DB;
  border-radius: 8px;
  padding: 10px 14px;
  color: var(--text-heading);
  font-family: inherit;
  font-size: 14px;
  transition: all 0.15s ease;
  outline: none;
}
.form-group input:focus {
  border-color: var(--brand);
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
}
.form-group input::placeholder {
  color: #9CA3AF;
}

.pw-wrap {
  position: relative;
}
.pw-wrap input {
  padding-right: 42px;
}
.pw-toggle {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 16px;
  padding: 4px;
  line-height: 1;
}
.pw-toggle:hover {
  color: var(--text-heading);
}

.btn-login {
  width: 100%;
  padding: 12px;
  background: var(--brand);
  color: #FFFFFF;
  border: none;
  border-radius: 8px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s ease;
  margin-top: 8px;
  box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
}
.btn-login:hover {
  background: var(--brand-hover);
}
.btn-login:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.error-box {
  display: none;
  background: #FEF2F2;
  border: 1px solid #FCA5A5;
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 13px;
  color: #991B1B;
  margin-top: 14px;
}
.error-box.show {
  display: flex;
  align-items: flex-start;
  gap: 8px;
}

.success-box {
  display: none;
  background: #ECFDF5;
  border: 1px solid #A7F3D0;
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 13px;
  color: #065F46;
  margin-top: 14px;
}
.success-box.show {
  display: flex;
  align-items: flex-start;
  gap: 8px;
}

.loading-spinner {
  display: inline-block;
  width: 16px;
  height: 16px;
  border: 2px solid rgba(255, 255, 255, 0.3);
  border-top-color: #FFFFFF;
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
  vertical-align: middle;
  margin-right: 6px;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}

.footer-note {
  text-align: center;
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
}

.link-btn {
  background: none;
  border: none;
  color: var(--brand);
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
  padding: 2px 0;
}
.link-btn:hover {
  text-decoration: underline;
}

.center-row {
  display: flex;
  justify-content: center;
  margin-top: 16px;
}

@media (max-width: 480px) {
  body { padding: 16px; }
  .login-card { padding: 24px 20px 20px; border-radius: 12px; }
}
</style>
</head>
<body>

<div class="login-card">
  <div class="brand">
    <div class="brand-logo-wrap">
      <img src="/favicon.png?v=2" class="app-logo-img" alt="Logo" />
    </div>
    <div class="app-brand-title">Prep365 AI Calling</div>
  </div>

  <h2>Set a new password</h2>
  <p class="subtitle" id="subtitle">Verifying your reset link…</p>

  <form id="resetForm" onsubmit="submitReset(event)" style="display:none;">
    <div class="form-group">
      <label>New password</label>
      <div class="pw-wrap">
        <input type="password" id="newPassword" placeholder="••••••••" autocomplete="new-password" required>
        <button type="button" class="pw-toggle" onclick="togglePw('newPassword', this)" title="Show/hide password">👁</button>
      </div>
    </div>
    <div class="form-group">
      <label>Confirm new password</label>
      <div class="pw-wrap">
        <input type="password" id="confirmPassword" placeholder="••••••••" autocomplete="new-password" required>
        <button type="button" class="pw-toggle" onclick="togglePw('confirmPassword', this)" title="Show/hide password">👁</button>
      </div>
    </div>
    <button type="submit" class="btn-login" id="resetBtn">Update password</button>
  </form>

  <div class="error-box" id="errorBox">
    <span>⚠️</span>
    <span id="errorMsg"></span>
  </div>

  <div class="success-box" id="successBox">
    <span>✅</span>
    <span id="successMsg"></span>
  </div>

  <div class="center-row" id="backRow" style="display:none;">
    <a href="/login" class="link-btn">← Back to sign in</a>
  </div>

  <p class="footer-note">Prep365 AI Calling © 2025</p>
</div>

<script>
let sbClient = null;
let hasRecoverySession = false;

async function initSupabase() {
  try {
    const cfg = await fetch('/auth/config').then(r => r.json());
    if (!cfg.supabaseUrl || !cfg.supabaseAnonKey) {
      failLink('Server configuration error. Please contact support.');
      return false;
    }
    sbClient = supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, {
      auth: {
        storageKey: 'testpreppundits_auth',
        autoRefreshToken: true,
        persistSession: true,
        detectSessionInUrl: true,
      }
    });
    return true;
  } catch (e) {
    failLink('Cannot connect to server. Please try again.');
    return false;
  }
}

function enableForm() {
  hasRecoverySession = true;
  document.getElementById('subtitle').textContent = 'Choose a strong new password for your account';
  document.getElementById('resetForm').style.display = 'block';
  hideError();
}

function failLink(msg) {
  document.getElementById('subtitle').textContent = 'We couldn’t verify your reset link';
  document.getElementById('resetForm').style.display = 'none';
  showError(msg);
  document.getElementById('backRow').style.display = 'flex';
}

async function boot() {
  const hash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
  if (hash.get('error')) {
    const desc = (hash.get('error_description') || '').replace(/\+/g, ' ');
    await initSupabase();
    failLink(desc || 'This reset link is invalid or has expired. Please request a new one.');
    return;
  }

  const ok = await initSupabase();
  if (!ok) return;

  sbClient.auth.onAuthStateChange((event, session) => {
    if ((event === 'PASSWORD_RECOVERY' || event === 'SIGNED_IN') && session) {
      enableForm();
    }
  });

  setTimeout(async () => {
    if (hasRecoverySession) return;
    const { data: { session } } = await sbClient.auth.getSession();
    if (session) {
      enableForm();
    } else {
      failLink('This reset link is invalid or has expired. Please request a new one from the sign-in page.');
    }
  }, 1200);
}

async function submitReset(e) {
  e.preventDefault();
  hideError();
  hideSuccess();

  const pw = document.getElementById('newPassword').value;
  const confirm = document.getElementById('confirmPassword').value;
  const btn = document.getElementById('resetBtn');

  if (pw.length < 8) return showError('Password must be at least 8 characters');
  if (pw !== confirm) return showError('Passwords do not match');

  btn.disabled = true;
  btn.innerHTML = '<span class="loading-spinner"></span> Updating…';

  try {
    const { data: { session } } = await sbClient.auth.getSession();
    if (!session) throw new Error('Your reset session has expired. Please request a new link.');

    const res = await fetch('/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ accessToken: session.access_token, newPassword: pw })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Could not update password.');

    await sbClient.auth.signOut();

    document.getElementById('resetForm').style.display = 'none';
    document.getElementById('subtitle').textContent = 'All set!';
    showSuccess('Your password has been updated. Redirecting you to sign in…');
    setTimeout(() => { window.location.href = '/login?reset=success'; }, 1800);
  } catch (err) {
    showError(err.message || 'Unexpected error. Please try again.');
    btn.disabled = false;
    btn.innerHTML = 'Update password';
  }
}

function togglePw(id, btn) {
  const inp = document.getElementById(id);
  if (inp.type === 'password') { inp.type = 'text'; btn.textContent = '🙈'; }
  else { inp.type = 'password'; btn.textContent = '👁'; }
}

function showError(msg) {
  document.getElementById('errorMsg').textContent = msg;
  document.getElementById('errorBox').classList.add('show');
}
function hideError() { document.getElementById('errorBox').classList.remove('show'); }
function showSuccess(msg) {
  document.getElementById('successMsg').textContent = msg;
  document.getElementById('successBox').classList.add('show');
}
function hideSuccess() { document.getElementById('successBox').classList.remove('show'); }

boot();
</script>
</body>
</html>

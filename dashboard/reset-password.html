<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Aiprep365</title>
<link rel="icon" type="image/png" href="/favicon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:      #0f172a;
  --panel:   #1e293b;
  --panel2:  #273449;
  --border:  #334155;
  --text:    #e2e8f0;
  --muted:   #94a3b8;
  --brand:   #3b82f6;
  --brand2:  #2563eb;
  --success: #10b981;
  --danger:  #ef4444;
}
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
body::before {
  content: '';
  position: fixed;
  top: -50%;
  left: -20%;
  width: 70%;
  height: 140%;
  background: radial-gradient(ellipse, rgba(59,130,246,.07) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}
.login-card {
  position: relative;
  z-index: 1;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 44px 40px 36px;
  width: 100%;
  max-width: 420px;
  box-shadow: 0 25px 60px rgba(0,0,0,.45);
}
.brand {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  margin-bottom: 32px;
}
.brand img {
  width: 72px;
  height: auto;
  background: #fff;
  padding: 8px;
  border-radius: 14px;
  box-shadow: 0 4px 16px rgba(0,0,0,.25);
}
.brand-name { font-size: 22px; font-weight: 800; color: var(--text); letter-spacing: -0.5px; }
.brand-sub  { font-size: 13px; color: var(--muted); margin-top: -4px; }
h2 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
.subtitle { font-size: 13px; color: var(--muted); margin-bottom: 28px; }
.form-group { margin-bottom: 16px; }
.form-group label {
  display: block; font-size: 12px; font-weight: 600; color: var(--muted);
  margin-bottom: 6px; text-transform: uppercase; letter-spacing: .5px;
}
.form-group input {
  width: 100%; background: var(--panel2); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px 14px; color: var(--text);
  font-family: inherit; font-size: 14px;
  transition: border-color .15s, box-shadow .15s; outline: none;
}
.form-group input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(59,130,246,.15); }
.form-group input::placeholder { color: #475569; }
.pw-wrap { position: relative; }
.pw-wrap input { padding-right: 44px; }
.pw-toggle {
  position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  background: none; border: none; color: var(--muted); cursor: pointer;
  font-size: 16px; padding: 4px; line-height: 1;
}
.pw-toggle:hover { color: var(--text); }
.btn-login {
  width: 100%; padding: 13px; background: var(--brand); color: #fff; border: none;
  border-radius: 10px; font-family: inherit; font-size: 15px; font-weight: 700;
  cursor: pointer; transition: background .15s, transform .1s, box-shadow .15s;
  margin-top: 8px; box-shadow: 0 4px 14px rgba(59,130,246,.3);
}
.btn-login:hover { background: var(--brand2); box-shadow: 0 6px 20px rgba(59,130,246,.35); }
.btn-login:active { transform: scale(.98); }
.btn-login:disabled { opacity: .6; cursor: not-allowed; transform: none; box-shadow: none; }
.error-box {
  display: none; background: rgba(239,68,68,.12); border: 1px solid rgba(239,68,68,.4);
  border-radius: 10px; padding: 11px 14px; font-size: 13px; color: #fca5a5; margin-top: 14px;
}
.error-box.show { display: flex; align-items: flex-start; gap: 8px; }
.success-box {
  display: none; background: rgba(16,185,129,.12); border: 1px solid rgba(16,185,129,.4);
  border-radius: 10px; padding: 11px 14px; font-size: 13px; color: #6ee7b7; margin-top: 14px;
}
.success-box.show { display: flex; align-items: flex-start; gap: 8px; }
.loading-spinner {
  display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.3);
  border-top-color: #fff; border-radius: 50%; animation: spin .6s linear infinite;
  vertical-align: middle; margin-right: 6px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.footer-note {
  text-align: center; font-size: 12px; color: #475569; margin-top: 24px;
  padding-top: 20px; border-top: 1px solid var(--border);
}
.link-btn {
  background: none; border: none; color: var(--brand); font-family: inherit;
  font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none; padding: 2px 0;
}
.link-btn:hover { text-decoration: underline; }
.center-row { display: flex; justify-content: center; margin-top: 16px; }
@media (max-width: 480px) {
  body { padding: 16px; }
  .login-card { padding: 24px 20px 20px; border-radius: 12px; }
  .brand img { width: 64px; }
  .brand-name { font-size: 20px; }
  h2 { font-size: 18px; }
}
</style>
</head>
<body>

<div class="login-card">
  <div class="brand">
    <img src="/assets/hg_logo1.png" alt="Aiprep365">
    <div class="brand-name">Aiprep365</div>
    <div class="brand-sub">AI Admissions Agent</div>
  </div>

  <h2>Set a new password</h2>
  <p class="subtitle" id="subtitle">Verifying your reset link…</p>

  <form id="resetForm" onsubmit="submitReset(event)" style="display:none;">
    <div class="form-group">
      <label>New password</label>
      <div class="pw-wrap">
        <input type="password" id="newPassword" placeholder="••••••••" autocomplete="new-password" required>
        <button type="button" class="pw-toggle" onclick="togglePw('newPassword', this)" title="Show/hide password">👁</button>
      </div>
    </div>
    <div class="form-group">
      <label>Confirm new password</label>
      <div class="pw-wrap">
        <input type="password" id="confirmPassword" placeholder="••••••••" autocomplete="new-password" required>
        <button type="button" class="pw-toggle" onclick="togglePw('confirmPassword', this)" title="Show/hide password">👁</button>
      </div>
    </div>
    <button type="submit" class="btn-login" id="resetBtn">Update password</button>
  </form>

  <div class="error-box" id="errorBox">
    <span>⚠️</span>
    <span id="errorMsg"></span>
  </div>

  <div class="success-box" id="successBox">
    <span>✅</span>
    <span id="successMsg"></span>
  </div>

  <div class="center-row" id="backRow" style="display:none;">
    <a href="/login" class="link-btn">← Back to sign in</a>
  </div>

  <p class="footer-note">Aiprep365 © 2025 · Admin use only</p>
</div>

<script>
let sbClient = null;
let hasRecoverySession = false;

async function initSupabase() {
  try {
    const cfg = await fetch('/auth/config').then(r => r.json());
    if (!cfg.supabaseUrl || !cfg.supabaseAnonKey) {
      failLink('Server configuration error. Please contact support.');
      return false;
    }
    sbClient = supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, {
      auth: {
        storageKey:        'aiprep365_auth',
        autoRefreshToken:  true,
        persistSession:    true,
        detectSessionInUrl: true,
      }
    });
    return true;
  } catch (e) {
    failLink('Cannot connect to server. Please try again.');
    return false;
  }
}

function enableForm() {
  hasRecoverySession = true;
  document.getElementById('subtitle').textContent = 'Choose a strong new password for your account';
  document.getElementById('resetForm').style.display = 'block';
  hideError();
}

// Shown when the recovery link is missing / invalid / expired
function failLink(msg) {
  document.getElementById('subtitle').textContent = 'We couldn’t verify your reset link';
  document.getElementById('resetForm').style.display = 'none';
  showError(msg);
  document.getElementById('backRow').style.display = 'flex';
}

async function boot() {
  // Surface Supabase errors passed back in the URL hash (e.g. expired link)
  const hash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
  if (hash.get('error')) {
    const desc = (hash.get('error_description') || '').replace(/\+/g, ' ');
    await initSupabase();
    failLink(desc || 'This reset link is invalid or has expired. Please request a new one.');
    return;
  }

  const ok = await initSupabase();
  if (!ok) return;

  // The recovery token is parsed from the URL hash automatically.
  sbClient.auth.onAuthStateChange((event, session) => {
    if ((event === 'PASSWORD_RECOVERY' || event === 'SIGNED_IN') && session) {
      enableForm();
    }
  });

  // Fallback: give detectSessionInUrl a moment, then check for a session directly.
  setTimeout(async () => {
    if (hasRecoverySession) return;
    const { data: { session } } = await sbClient.auth.getSession();
    if (session) {
      enableForm();
    } else {
      failLink('This reset link is invalid or has expired. Please request a new one from the sign-in page.');
    }
  }, 1200);
}

async function submitReset(e) {
  e.preventDefault();
  hideError();
  hideSuccess();

  const pw      = document.getElementById('newPassword').value;
  const confirm = document.getElementById('confirmPassword').value;
  const btn     = document.getElementById('resetBtn');

  if (pw.length < 8)   return showError('Password must be at least 8 characters');
  if (pw !== confirm)  return showError('Passwords do not match');

  btn.disabled  = true;
  btn.innerHTML = '<span class="loading-spinner"></span> Updating…';

  try {
    const { data: { session } } = await sbClient.auth.getSession();
    if (!session) throw new Error('Your reset session has expired. Please request a new link.');

    const res  = await fetch('/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ accessToken: session.access_token, newPassword: pw })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Could not update password.');

    // Clear the recovery session so it can't linger, then send to login.
    await sbClient.auth.signOut();

    document.getElementById('resetForm').style.display = 'none';
    document.getElementById('subtitle').textContent = 'All set!';
    showSuccess('Your password has been updated. Redirecting you to sign in…');
    setTimeout(() => { window.location.href = '/login?reset=success'; }, 1800);
  } catch (err) {
    showError(err.message || 'Unexpected error. Please try again.');
    btn.disabled  = false;
    btn.innerHTML = 'Update password';
  }
}

function togglePw(id, btn) {
  const inp = document.getElementById(id);
  if (inp.type === 'password') { inp.type = 'text';  btn.textContent = '🙈'; }
  else                         { inp.type = 'password'; btn.textContent = '👁'; }
}

function showError(msg) {
  document.getElementById('errorMsg').textContent = msg;
  document.getElementById('errorBox').classList.add('show');
}
function hideError() { document.getElementById('errorBox').classList.remove('show'); }
function showSuccess(msg) {
  document.getElementById('successMsg').textContent = msg;
  document.getElementById('successBox').classList.add('show');
}
function hideSuccess() { document.getElementById('successBox').classList.remove('show'); }

boot();
</script>
</body>
</html>

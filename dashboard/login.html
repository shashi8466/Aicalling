<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Prep365 AI Calling</title>
<link rel="icon" type="image/png" href="/favicon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="/assets/libs/supabase.min.js"></script>
<script src="/assets/branding.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #F8FAFC;
  --panel: #FFFFFF;
  --border: #E5E7EB;
  --text-heading: #0F172A;
  --text-body: #4B5563;
  --text-muted: #64748B;
  --brand: #2563EB;
  --brand-hover: #1D4ED8;
  --success: #10B981;
  --danger: #EF4444;
}
body {
  font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text-body);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.login-card {
  position: relative;
  z-index: 1;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 36px 32px;
  width: 100%;
  max-width: 420px;
  box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.06), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
}

.brand {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  margin-bottom: 24px;
}
/* Logo shown as-is (no coloured tile), sized to the logo's own shape */
.brand-logo-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  background: none;
}
.brand img.app-logo-img {
  display: block;
  width: auto;
  height: auto;
  max-width: 280px;
  max-height: 96px;
  object-fit: contain;
  border-radius: 10px;
}
.brand .app-brand-title {
  font-size: 18px;
  font-weight: 800;
  color: var(--text-heading);
  letter-spacing: -0.01em;
}

/* Tabs */
.auth-tabs {
  display: flex;
  background: #F1F5F9;
  border-radius: 8px;
  padding: 4px;
  margin-bottom: 24px;
  gap: 4px;
  border: 1px solid #E2E8F0;
}
.auth-tab {
  flex: 1;
  padding: 8px 16px;
  border: none;
  background: transparent;
  color: var(--text-muted);
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.15s ease;
}
.auth-tab.active {
  background: #FFFFFF;
  color: var(--brand);
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
}

h2 {
  font-size: 20px;
  font-weight: 700;
  color: var(--text-heading);
  margin-bottom: 4px;
  text-align: center;
}
.subtitle {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 24px;
  text-align: center;
}

.form-group {
  margin-bottom: 16px;
}
label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: #334155;
  margin-bottom: 6px;
}
input, select {
  width: 100%;
  padding: 9px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: #FFFFFF;
  color: var(--text-heading);
  font-family: inherit;
  font-size: 14px;
  outline: none;
  transition: all 0.15s ease;
}
input:focus, select:focus {
  border-color: var(--brand);
  box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
}

.pw-wrap {
  position: relative;
}
.pw-toggle {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 14px;
}

.forgot-row {
  display: flex;
  justify-content: flex-end;
  margin-bottom: 20px;
}
.link-btn {
  font-size: 13px;
  color: var(--brand);
  text-decoration: none;
  font-weight: 500;
}
.link-btn:hover {
  text-decoration: underline;
}

.btn-login {
  width: 100%;
  padding: 10px 16px;
  background: var(--brand);
  color: #FFFFFF;
  border: none;
  border-radius: 8px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
  transition: background 0.15s ease;
}
.btn-login:hover {
  background: var(--brand-hover);
}
.btn-login:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.error-box, .success-box {
  display: none;
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 13px;
  margin-top: 16px;
  align-items: center;
  gap: 8px;
}
.error-box.show {
  display: flex;
  background: #FEF2F2;
  border: 1px solid #FECACA;
  color: #B91C1C;
}
.success-box.show {
  display: flex;
  background: #F0FDF4;
  border: 1px solid #BBF7D0;
  color: #15803D;
}

.footer-note {
  font-size: 11px;
  color: #94A3B8;
  text-align: center;
  margin-top: 24px;
}
.back-home-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-muted);
  text-decoration: none;
  margin-bottom: 16px;
}
.back-home-link:hover {
  color: var(--text-heading);
}

.signup-only {
  display: none;
}
</style>
</head>
<body data-brand-dynamic-title="Sign In">

<div class="login-card">
  <a href="/" class="back-home-link">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    Back to Home
  </a>

  <div class="brand">
    <div class="brand-logo-wrap">
      <img src="/assets/hg_logo1.png" alt="Prep365 AI Calling" class="app-logo-img">
    </div>
    <div class="app-brand-title">Prep365 AI Calling</div>
  </div>

  <div class="auth-tabs">
    <button type="button" class="auth-tab active" onclick="switchMode('signin')" id="tabSignin">Sign In</button>
    <button type="button" class="auth-tab" onclick="switchMode('signup')" id="tabSignup">Sign Up</button>
  </div>

  <h2>Welcome back</h2>
  <p class="subtitle">Sign in to your dashboard</p>

  <form id="loginForm" onsubmit="handleAuthSubmit(event)">
    <div class="form-group signup-only" id="groupFullName">
      <label>Full Name</label>
      <input type="text" id="fullName" placeholder="John Doe">
    </div>

    <div class="form-group">
      <label>Email address</label>
      <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email" required>
    </div>

    <div class="form-group signup-only" id="groupPhone">
      <label>Phone Number</label>
      <input type="tel" id="phone" placeholder="+1 (555) 000-0000">
    </div>

    <div class="form-group signup-only" id="groupRole">
      <label>User Role</label>
      <select id="signupRole">
        <option value="admin">Admin</option>
        <option value="counselor" selected>Admissions Counselor</option>
      </select>
    </div>

    <div class="form-group">
      <label>Password</label>
      <div class="pw-wrap">
        <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" required>
        <button type="button" class="pw-toggle" onclick="togglePw()" id="pwToggleBtn" title="Show/hide password">👁</button>
      </div>
    </div>

    <div class="forgot-row signin-only-inline" id="forgotRow">
      <a href="#" class="link-btn" id="forgotLink" onclick="showForgot(event)">Forgot password?</a>
    </div>

    <button type="submit" class="btn-login" id="loginBtn">Sign In</button>
  </form>

  <!-- Forgot-password view (hidden by default) -->
  <form id="forgotForm" onsubmit="submitForgot(event)" style="display:none;">
    <div class="form-group">
      <label>Email address</label>
      <input type="email" id="forgotEmail" placeholder="you@example.com" autocomplete="email" required>
    </div>
    <button type="submit" class="btn-login" id="forgotBtn">Send reset link</button>
    <div class="forgot-row" style="justify-content:center; margin-top:16px;">
      <a href="#" class="link-btn" onclick="hideForgot(event)">← Back to sign in</a>
    </div>
  </form>

  <div class="error-box" id="errorBox">
    <span>⚠️</span>
    <span id="errorMsg">Invalid email or password.</span>
  </div>

  <div class="success-box" id="successBox">
    <span>✅</span>
    <span id="successMsg"></span>
  </div>

  <p class="footer-note">Prep365 AI Calling © 2026 · Role-based access</p>
</div>

<script>
let sbClient = null;
let currentMode = 'signin';

// Fetch Supabase config from backend, then init client
async function initSupabase() {
  try {
    const cfg = await fetch('/auth/config').then(r => r.json());
    if (!cfg.supabaseUrl || !cfg.supabaseAnonKey) {
      showError('Server configuration error. Please contact support.');
      return false;
    }
    sbClient = supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, {
      auth: {
        storageKey:       'testpreppundits_auth',
        autoRefreshToken: true,
        persistSession:   true,
      }
    });
    localStorage.setItem('sb_pub_config', JSON.stringify(cfg));
    return true;
  } catch (e) {
    showError('Cannot connect to server. Please try again.');
    return false;
  }
}

// Check if already logged in
async function checkExistingSession() {
  if (!sbClient) return;
  const { data: { session } } = await sbClient.auth.getSession();
  if (session) {
    window.location.href = '/dashboard';
  }
}

function switchMode(mode) {
  currentMode = mode;
  hideError();
  hideSuccess();
  exitForgotView();

  const title = document.querySelector('h2');
  const subtitle = document.querySelector('.subtitle');
  const tabSignin = document.getElementById('tabSignin');
  const tabSignup = document.getElementById('tabSignup');
  const signupFields = document.querySelectorAll('.signup-only');
  const submitBtn = document.getElementById('loginBtn');
  const fullNameInput = document.getElementById('fullName');
  const forgotRow = document.getElementById('forgotRow');

  if (mode === 'signup') {
    title.textContent = 'Create account';
    subtitle.textContent = 'Register a new admin or counselor';
    tabSignup.classList.add('active');
    tabSignin.classList.remove('active');
    signupFields.forEach(f => f.style.display = 'block');
    fullNameInput.required = true;
    submitBtn.textContent = 'Register & Sign In';
    forgotRow.style.display = 'none';
  } else {
    title.textContent = 'Welcome back';
    subtitle.textContent = 'Sign in to your dashboard';
    tabSignin.classList.add('active');
    tabSignup.classList.remove('active');
    signupFields.forEach(f => f.style.display = 'none');
    fullNameInput.required = false;
    submitBtn.textContent = 'Sign In';
    forgotRow.style.display = 'flex';
  }
}

function showForgot(e) {
  if (e) e.preventDefault();
  hideError();
  hideSuccess();
  document.getElementById('loginForm').style.display = 'none';
  document.querySelector('.auth-tabs').style.display = 'none';
  document.getElementById('forgotForm').style.display = 'block';
  document.querySelector('h2').textContent = 'Reset password';
  document.querySelector('.subtitle').textContent = 'Enter your email and we will send a reset link';
  const loginEmail = document.getElementById('loginEmail').value.trim();
  if (loginEmail) document.getElementById('forgotEmail').value = loginEmail;
}

function exitForgotView() {
  document.getElementById('forgotForm').style.display = 'none';
  document.querySelector('.auth-tabs').style.display = 'flex';
  document.getElementById('loginForm').style.display = 'block';
}

function hideForgot(e) {
  if (e) e.preventDefault();
  hideError();
  hideSuccess();
  exitForgotView();
  switchMode('signin');
}

async function submitForgot(e) {
  e.preventDefault();
  hideError();
  hideSuccess();
  const email = document.getElementById('forgotEmail').value.trim();
  const btn   = document.getElementById('forgotBtn');
  if (!email) return showError('Email is required');

  btn.disabled  = true;
  btn.textContent = 'Sending…';

  try {
    const res  = await fetch('/auth/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Could not send reset email.');

    showSuccess(data.message || 'If an account exists for that email, a password reset link has been sent.');
    btn.disabled  = false;
    btn.textContent = 'Send reset link';
  } catch (err) {
    showError(err.message || 'Unexpected error. Please try again.');
    btn.disabled  = false;
    btn.textContent = 'Send reset link';
  }
}

async function handleAuthSubmit(e) {
  e.preventDefault();
  if (currentMode === 'signup') {
    await handleSignup();
  } else {
    await handleLogin();
  }
}

async function handleSignup() {
  const fullName = document.getElementById('fullName').value.trim();
  const email    = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const phone    = document.getElementById('phone').value.trim();
  const role     = document.getElementById('signupRole').value;
  const btn      = document.getElementById('loginBtn');

  if (!fullName) return showError('Full name is required');
  if (password.length < 8) return showError('Password must be at least 8 characters');

  btn.disabled  = true;
  btn.textContent = 'Creating account…';

  try {
    const signupRes = await fetch('/auth/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ fullName, email, password, phone, role })
    });

    const signupData = await signupRes.json();
    if (!signupRes.ok) {
      throw new Error(signupData.error || 'Registration failed');
    }

    const { data, error } = await sbClient.auth.signInWithPassword({ email, password });
    if (error) {
      showError(friendlyError(error.message));
      btn.disabled  = false;
      btn.textContent = 'Register & Sign In';
      return;
    }

    const meRes = await fetch('/auth/me', {
      headers: { 'Authorization': 'Bearer ' + data.session.access_token }
    });
    if (!meRes.ok) {
      const errData = await meRes.json();
      showError(errData.error || 'Account validation failed.');
      await sbClient.auth.signOut();
      btn.disabled  = false;
      btn.textContent = 'Register & Sign In';
      return;
    }

    window.location.href = '/dashboard';
  } catch (err) {
    showError(err.message || 'Unexpected error. Please try again.');
    btn.disabled  = false;
    btn.textContent = 'Register & Sign In';
  }
}

async function handleLogin() {
  const email    = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const btn      = document.getElementById('loginBtn');

  btn.disabled  = true;
  btn.textContent = 'Signing in…';

  try {
    const { data, error } = await sbClient.auth.signInWithPassword({ email, password });
    if (error) {
      showError(friendlyError(error.message));
      btn.disabled  = false;
      btn.textContent = 'Sign In';
      return;
    }

    const meRes = await fetch('/auth/me', {
      headers: { 'Authorization': 'Bearer ' + data.session.access_token }
    });
    if (!meRes.ok) {
      const errData = await meRes.json();
      showError(errData.error || 'Account validation failed.');
      await sbClient.auth.signOut();
      btn.disabled  = false;
      btn.textContent = 'Sign In';
      return;
    }

    window.location.href = '/dashboard';
  } catch (err) {
    showError(err.message || 'Unexpected error. Please try again.');
    btn.disabled  = false;
    btn.textContent = 'Sign In';
  }
}

function togglePw() {
  const inp = document.getElementById('loginPassword');
  const btn = document.getElementById('pwToggleBtn');
  if (inp.type === 'password') {
    inp.type    = 'text';
    btn.textContent = '🙈';
  } else {
    inp.type    = 'password';
    btn.textContent = '👁';
  }
}

function showError(msg) {
  document.getElementById('errorMsg').textContent = msg;
  document.getElementById('errorBox').classList.add('show');
}
function hideError() {
  document.getElementById('errorBox').classList.remove('show');
}
function showSuccess(msg) {
  document.getElementById('successMsg').textContent = msg;
  document.getElementById('successBox').classList.add('show');
}
function hideSuccess() {
  document.getElementById('successBox').classList.remove('show');
}
function friendlyError(msg) {
  if (!msg) return 'Sign in failed. Please try again.';
  if (msg.includes('Invalid login credentials')) return 'Incorrect email or password.';
  if (msg.includes('Email not confirmed'))        return 'Email not confirmed. Contact your admin.';
  if (msg.includes('User not found'))             return 'No account found with this email.';
  if (msg.includes('Too many requests'))          return 'Too many attempts. Please wait a moment.';
  return msg;
}

function checkResetFlag() {
  const params = new URLSearchParams(window.location.search);
  if (params.get('reset') === 'success') {
    showSuccess('Your password has been reset. Please sign in with your new password.');
    window.history.replaceState({}, document.title, '/login');
  }
}

(async () => {
  const ok = await initSupabase();
  if (ok) await checkExistingSession();
  checkResetFlag();
})();
</script>
</body>
</html>
